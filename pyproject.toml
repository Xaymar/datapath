# Python package for DataPath. Build a wheel with `pip wheel .` or `python -m build`;
# release wheels come from cibuildwheel (.github/workflows/python.yml).

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
# PyPI has no namespaces, so the distribution uses the reverse-DNS name. The
# import name is plain `datapath`.
name = "com.xaymar.datapath"
dynamic = ["version"]
description = "Fast, predictable message passing between processes on the same machine"
readme = "python/README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Narta Xaymar Dirks", email = "info@xaymar.com" }]
keywords = ["ipc", "low-latency", "named-pipes", "unix-sockets", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Xaymar/datapath"
Source = "https://github.com/Xaymar/datapath"
Issues = "https://github.com/Xaymar/datapath/issues"

[dependency-groups]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
cmake.build-type = "Release"
# abi3 wheel for CPython 3.12+; older and free-threaded interpreters get their own.
wheel.py-api = "cp312"
wheel.packages = ["python/datapath"]
# Only the extension module; the C++ library's own install rules stay out.
install.components = ["python"]
sdist.include = ["include/**", "source/**", "cmake/**", "python/**"]
sdist.exclude = [
    ".github/**", "build/**", "build-*/**", "docs/**", "samples/**", "tests/**",
    "**/__pycache__/**",
]

[tool.scikit-build.cmake.define]
DATAPATH_BUILD_PYTHON = "ON"
DATAPATH_BUILD_TESTS = "OFF"
DATAPATH_BUILD_SAMPLES = "OFF"
DATAPATH_SHARED = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?sx)
    set\(VERSION_MAJOR\s+(?P<major>\d+)\).*?
    set\(VERSION_MINOR\s+(?P<minor>\d+)\).*?
    set\(VERSION_PATCH\s+(?P<patch>\d+)\)
'''
result = "{major}.{minor}.{patch}"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
# CPython 3.10/3.11 get version-specific wheels, 3.12+ shares one abi3 wheel
# (cibuildwheel tests it on newer versions), and free-threaded 3.14t/3.15t
# get their own. macOS isn't supported by the library yet.
build = ["cp310-*", "cp311-*", "cp312-*", "cp314t-*", "cp315t-*"]
skip = ["*-win32", "*_i686", "*-macosx_*"]
test-groups = ["test"]
test-sources = ["python/tests", "pyproject.toml"]
test-command = "pytest -q python/tests"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["native"]
