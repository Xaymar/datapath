[package]
name = "datapath-capi"
description = "C ABI over the native Rust core of DataPath (identical to include/datapath/datapath.h, C ABI version 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "datapath_capi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
datapath-core = { path = "../core" }
