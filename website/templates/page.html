<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="layout-{{layout}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
	<div class="top-inner">
		<a class="brand" href="{{root}}" aria-label="DataPath home">
			<svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" class="brand-bg"/><path d="M8 11h9a5 5 0 0 1 0 10H8" class="brand-fg"/><circle cx="8" cy="11" r="2.4" class="brand-dot"/><circle cx="8" cy="21" r="2.4" class="brand-dot"/></svg>
			<span>DataPath</span>
		</a>
		<nav class="primary" aria-label="Primary">{{nav}}</nav>
		<div class="top-actions">
			<button class="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
			<a class="gh" href="{{repo}}" aria-label="DataPath on GitHub">
				<svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
				<span>GitHub</span>
			</a>
		</div>
	</div>
</header>
<div class="shell">
	{{sidebar}}
	<main id="main" class="content">
		{{body}}
		{{edit}}
	</main>
	{{toc}}
</div>
<footer class="foot">
	<div class="foot-inner">
		<p>DataPath is free software under the <a href="{{repo}}/blob/root/LICENSE">BSD 3-Clause License</a>.<br>© 2017–2026 Narta Xaymar Dirks.</p>
		<p><a href="{{repo}}">Source</a> · <a href="{{repo}}/issues">Issues</a> · <a href="{{repo}}/blob/root/CONTRIBUTING.md">Contributing</a></p>
	</div>
</footer>
<script src="{{root}}site.js" defer></script>
</body>
</html>
