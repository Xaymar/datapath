# Builds and tests the Python wheels and sdist. Publishing to PyPI only happens
# when this workflow is started by hand with "publish" set, and needs PyPI
# trusted publishing configured for the `pypi` environment first.

name: Python

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - "CMakeLists.txt"
      - "include/**"
      - "pyproject.toml"
      - "python/**"
      - "source/**"
  push:
    branches: [root]
    paths:
      - ".github/workflows/python.yml"
      - "CMakeLists.txt"
      - "include/**"
      - "pyproject.toml"
      - "python/**"
      - "source/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels and sdist to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners only: no emulation, so tests run on the real platform.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist
        run: pipx run build --sdist
      - name: Build and test a wheel from the sdist
        run: |
          python -m pip install dist/*.tar.gz pytest
          cd python/tests && python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/com.xaymar.datapath/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
