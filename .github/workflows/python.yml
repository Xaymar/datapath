# Builds and tests the Python wheels (artifacts `wheels-*`) and the sdist
# (artifact `sdist`). Publishing to TestPyPI/PyPI happens in release.yml, which
# calls this workflow.

name: Python

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - "CMakeLists.txt"
      - "include/**"
      - "pyproject.toml"
      - "python/**"
      - "source/**"
  push:
    branches: [root]
    paths:
      - ".github/workflows/python.yml"
      - "CMakeLists.txt"
      - "include/**"
      - "pyproject.toml"
      - "python/**"
      - "source/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release run does not
  # cancel (or get cancelled by) a plain CI run on the same ref.
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners only: no emulation, so tests run on the real platform.
        # macos-14 is arm64 and also builds the x86_64 wheels, tested under Rosetta.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist
        run: pipx run build --sdist
      - name: Build and test a wheel from the sdist
        run: |
          python -m pip install dist/*.tar.gz pytest
          cd python/tests && python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

